[package]
name = "mss-native-check-broker"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

# Standalone reviewed crate; do not build Makepad for a broker-only change.
[workspace]

[features]
native-probes = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_StationsAndDesktops", "Win32_Graphics_Gdi", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Com"] }

[[bin]]
name = "mss-native-check-broker"
path = "src/main.rs"

[[bin]]
name = "mss-broker-probe"
path = "src/bin/probe.rs"
required-features = ["native-probes"]

[[bin]]
name = "mss-broker-supervisor-probe"
path = "src/bin/supervisor_probe.rs"
required-features = ["native-probes"]
